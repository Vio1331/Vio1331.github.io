<header class="site-header">

      {% include brand-mark.html %}
      <span class="brand-name">OPTICS</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">打开导航</span>
      <span></span><span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="{{ '/journal/' | relative_url }}" {% if page.section == 'journal' %}aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/photography/' | relative_url }}" {% if page.section == 'photography' %}aria-current="page"{% endif %}>摄影</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>关于</a>
