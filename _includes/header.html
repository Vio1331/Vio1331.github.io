<header class="site-header">
  <div class="site-shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
      {% include brand-mark.html %}
      <span class="brand-name">OPTICS</span>
    </a>
    {% if page.collection == 'journal' or page.layout == 'journal' %}
    <button class="reading-toc-trigger reading-toc-trigger--header" type="button" data-reading-toc-button aria-controls="reading-toc" aria-expanded="false" hidden>目录</button>
    {% endif %}
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">打开导航</span>
      <span></span><span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="{{ '/journal/' | relative_url }}" {% if page.section == 'journal' %}aria-current="page"{% endif %}>文字</a>
      <a href="{{ '/photography/' | relative_url }}" {% if page.section == 'photography' %}aria-current="page"{% endif %}>影像</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>关于</a>
    </nav>
  </div>
</header>
