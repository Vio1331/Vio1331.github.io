<article class="post-row">
  <div class="post-meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
    {% if include.post.category %}<span>{{ include.post.category }}</span>{% endif %}
  </div>
  <div class="post-main">
    <h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
    {% if include.post.excerpt_text %}<p>{{ include.post.excerpt_text }}</p>{% endif %}
  </div>
  <span class="post-arrow" aria-hidden="true">↗</span>
</article>
