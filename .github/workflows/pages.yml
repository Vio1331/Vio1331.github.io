name: Build and deploy OPTICS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optics-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_source: ${{ steps.source.outputs.type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/content-build/package-lock.json
      - name: Install content builder
        run: npm ci --prefix tools/content-build --ignore-scripts --no-audit --no-fund
      - name: Test photography markup
        run: npm test --prefix tools/content-build
      - name: Check copyable examples and prepare build copy
        run: node tools/content-build/cli.mjs prepare --include-examples
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Test journal metadata and image paths
        run: bundle exec ruby tools/content-build/test/journal_test.rb
      - name: Read Pages publishing source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "type=$pages_source" >> "$GITHUB_OUTPUT"
          if [ "$pages_source" != "workflow" ]; then
            echo '### 新写法尚待启用' >> "$GITHUB_STEP_SUMMARY"
            echo '构建会继续校验，但不会和现有分支发布互相覆盖。请在 Settings → Pages → Build and deployment → Source 选择 GitHub Actions，然后手动运行本工作流一次。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
      - name: Build Jekyll with the site plugins
        working-directory: _content_build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ../_site
      - name: Verify generated content and image references
        run: bundle exec ruby tools/content-build/verify_site.rb _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_source == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
