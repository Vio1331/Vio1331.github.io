title: OPTICS
tagline: 个人文章与摄影网站
description: Vio 的个人文章与摄影网站。
url: "https://vio1331.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
strict_front_matter: true

author:
  name: Vio
  bio: 个人网站作者。

collections:
  journal:
    output: true
    permalink: /journal/:name/
  photography:
    output: true
    permalink: /photography/:name/

defaults:
  - scope:
      path: ""
      type: journal
    values:
      layout: journal
      section: journal
  - scope:
      path: ""
      type: photography
    values:
      layout: photography
      section: photography

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - AGENTS.md
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - .openai
  - tools
  - node_modules
  - _content_build

sass:
  style: compressed
