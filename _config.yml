title: OPTICS
tagline: 个人文章与摄影网站
description: Vio 的个人文章与摄影网站。
url: "https://vio1331.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: Vio
  bio: 个人网站作者。

permalink: /journal/:title/
paginate_path: /journal/page:num/

collections:
  photography:
    output: true
    permalink: /photography/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: journal
  - scope:
      path: ""
      type: photography
    values:
      layout: photo-story
      section: photography

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .openai

sass:
  style: compressed

feed:
  path: feed.xml
